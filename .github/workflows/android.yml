name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Syntra's own proot (Termux source + NDK, static talloc) and bundle as native libs
        run: |
          set -e
          J=$PWD/app/src/main/jniLibs/arm64-v8a; mkdir -p $J
          git clone -q https://github.com/green-green-avk/build-proot-android bpa && git -C bpa checkout -q 01f83b8841358450c78333d1b33ab30d4943bec4
          # Fallback: green-green-avk's prebuilt Android-app proot.
          mkdir -p t && tar xzf bpa/packages/proot-android-aarch64.tar.gz -C t
          cp t/root/bin/proot $J/libproot-gg.so; cp t/root/libexec/proot/loader $J/libproot-gg-loader.so
          # Static talloc via green-green-avk's cross-compile recipe, for aarch64 only, with this runner's NDK.
          cd bpa
          sed -i "s|^NDK=.*|NDK=\"$ANDROID_NDK_LATEST_HOME\"|; s|^ARCHS=.*|ARCHS='aarch64'|" config
          ./get-talloc.sh >/dev/null && ./make-talloc-static.sh >/dev/null
          . ./config; set-arch aarch64
          # Termux's maintained proot (knows the syscalls Ubuntu 24.04 uses), built for Syntra: loader unbundled
          # so it runs from nativeLibraryDir (Android blocks executing files from app data).
          git clone -q https://github.com/termux/proot tp && git -C tp checkout -q b27d81a68d765f3462e807f4a14e01a03f8e89ea
          export CFLAGS="-I$STATIC_ROOT/include -DARG_MAX=131072 -Werror=implicit-function-declaration"
          export LDFLAGS="-L$STATIC_ROOT/lib"
          make -C tp/src V=1 PROOT_UNBUNDLE_LOADER=. HAS_LOADER_32BIT= proot loader/loader >/dev/null
          "$STRIP" tp/src/proot tp/src/loader/loader
          cp tp/src/proot $J/libproot.so; cp tp/src/loader/loader $J/libproot-loader.so
          cd ..; ls -la $J; file $J/* || true
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew --no-daemon testFullDebugUnitTest assembleFullDebug assembleLiteDebug 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILED|Test.*>.*FAILED|Exception|expected:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            for f in app/build/test-results/*/*.xml; do grep -A3 "<failure" "$f" | head -8 | while IFS= read -r l; do echo "::error::$l"; done; done
            exit 1; }
      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/full/debug/*.apk out/SyntraOS-full.apk
          cp app/build/outputs/apk/lite/debug/*.apk out/SyntraOS-lite.apk
          for a in out/*.apk; do for l in libsyntra_llm.so libproot.so libproot-loader.so libproot-gg.so libproot-gg-loader.so; do unzip -l "$a" | grep -q "lib/arm64-v8a/$l" || { echo "$l missing in $a"; exit 1; }; done; done
          unzip -p out/SyntraOS-lite.apk AndroidManifest.xml | grep -qa SyntraAccessibility && { echo "lite must not declare accessibility"; exit 1; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: syntra-os-apks
          path: out/*.apk
