name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Syntra's own proot (Termux source + NDK, static talloc) and bundle as native libs
        run: |
          bash .github/build-proot.sh > proot.log 2>&1 || { { grep -nE "error:|fatal|No such|not found|undefined" proot.log | head -25; tail -6 proot.log; } | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          tail -12 proot.log
      - name: Vulkan headers + glslc for the optional GPU backend
        run: |
          set -e
          sudo apt-get install -y -qq glslc >/dev/null
          P=$PWD/vkdeps
          for r in Vulkan-Headers SPIRV-Headers; do
            git clone -q --depth 1 https://github.com/KhronosGroup/$r && cmake -S $r -B $r/b -DCMAKE_INSTALL_PREFIX=$P >/dev/null && cmake --install $r/b >/dev/null
          done
          ls $P/include/vulkan/vulkan.hpp $P/share/cmake/SPIRV-Headers
          echo "SYNTRA_VK_PREFIX=$P" >> $GITHUB_ENV
          echo "SYNTRA_GLSLC=$(command -v glslc)" >> $GITHUB_ENV
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew --no-daemon testFullDebugUnitTest assembleFullDebug assembleLiteDebug 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILED|Test.*>.*FAILED|Exception|expected:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            for f in app/build/test-results/*/*.xml; do grep -A3 "<failure" "$f" | head -8 | while IFS= read -r l; do echo "::error::$l"; done; done
            exit 1; }
      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/full/debug/*.apk out/SyntraOS-full.apk
          cp app/build/outputs/apk/lite/debug/*.apk out/SyntraOS-lite.apk
          for a in out/*.apk; do for l in libsyntra_llm.so libproot.so libproot-loader.so libtalloc.so libproot-gg.so libproot-gg-loader.so; do unzip -l "$a" | grep -q "lib/arm64-v8a/$l" || { echo "$l missing in $a"; exit 1; }; done; done
          unzip -p out/SyntraOS-lite.apk AndroidManifest.xml | grep -qa SyntraAccessibility && { echo "lite must not declare accessibility"; exit 1; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: syntra-os-apks
          path: out/*.apk
