name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify on-device LLM library is packaged
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/libsyntra_llm.so'
      - uses: actions/upload-artifact@v4
        with:
          name: syntra-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk
